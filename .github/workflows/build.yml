name: Build J-Slice

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -A x64 2>&1 | tee configure.log || {
            echo "::error title=CMake configure failed::$(tail -n 25 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Build plugin and tests
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 --target JSlice_VST3 JSlice_Standalone JSliceTests 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(grep -E 'error|Error' build.log | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          ./build/JSliceTests_artefacts/Release/JSliceTests.exe test-output 2>&1 | tee tests.log || {
            echo "::error title=Tests failed::$(grep -E 'FAIL|failure' tests.log | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Package
        shell: pwsh
        run: |
          $out = "package/J-Slice"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/JSlice_artefacts/Release/VST3/J-Slice.vst3" "$out/"
          Copy-Item "build/JSlice_artefacts/Release/Standalone/J-Slice.exe" "$out/"
          Copy-Item "docs/INSTALL-WINDOWS.txt" "$out/LISEZ-MOI.txt"
          New-Item -ItemType Directory -Force -Path "$out/demo-loops" | Out-Null
          Copy-Item "test-output/*.wav" "$out/demo-loops/"
          Compress-Archive -Path "$out/*" -DestinationPath "J-Slice-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Slice-Windows
          path: J-Slice-Windows.zip

  macos:
    name: macOS (VST3 + AU + Standalone, Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 2>&1 | tee configure.log || {
            echo "::error title=CMake configure failed::$(tail -n 25 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

      - name: Build plugin and tests
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 --target JSlice_VST3 JSlice_AU JSlice_Standalone JSliceTests 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(grep -E 'error' build.log | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

      - name: Run tests
        run: ./build/JSliceTests_artefacts/Release/JSliceTests test-output

      - name: Ad-hoc code signature (required to load on Apple Silicon)
        run: |
          A=build/JSlice_artefacts/Release
          for b in "$A/VST3/J-Slice.vst3" "$A/AU/J-Slice.component" "$A/Standalone/J-Slice.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
            lipo -info "$(find "$b/Contents/MacOS" -type f | head -n 1)"
          done

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/JSlice_artefacts/Release/AU/J-Slice.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu JSlc Kozz

      - name: Package
        run: |
          out=package/J-Slice
          mkdir -p "$out/demo-loops"
          A=build/JSlice_artefacts/Release
          ditto "$A/VST3/J-Slice.vst3" "$out/J-Slice.vst3"
          ditto "$A/AU/J-Slice.component" "$out/J-Slice.component"
          ditto "$A/Standalone/J-Slice.app" "$out/J-Slice.app"
          cp docs/INSTALL-MAC.txt "$out/LISEZ-MOI.txt"
          cp docs/install-mac.sh "$out/install.sh"
          chmod +x "$out/install.sh"
          cp test-output/*.wav "$out/demo-loops/"
          (cd package && ditto -c -k --sequesterRsrc --keepParent J-Slice ../J-Slice-macOS.zip)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Slice-macOS
          path: J-Slice-macOS.zip

  release:
    name: Publish downloads
    needs: [ windows, macos ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish "latest" download (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/J-Slice-Windows.zip dist/J-Slice-macOS.zip \
            --title "J-Slice - latest build" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}.
          Windows : unzip, copy J-Slice.vst3 to C:\\Program Files\\Common Files\\VST3, rescan plug-ins in Ableton Live.
          macOS : unzip, open Terminal, type bash + space, drag install.sh into the window, press Enter (see LISEZ-MOI.txt)." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "J-Slice $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  linux-tests:
    name: Linux (tests + pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev libxcomposite-dev xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target JSlice_VST3 JSliceTests JSliceHarness
      - name: Core tests
        run: ./build/JSliceTests_artefacts/Release/JSliceTests test-output
      - name: Integration harness
        run: xvfb-run -a -s "-screen 0 1400x1000x24" ./build/JSliceHarness_artefacts/Release/JSliceHarness test-output/synthetic_break_136bpm.wav harness-output
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process build/JSlice_artefacts/Release/VST3/J-Slice.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: harness-output/*.png
